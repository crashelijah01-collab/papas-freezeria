
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Papa's Freezeria</title>

  <script src="ruffle.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game {
      width: 100%;
      max-width: 1000px;
    }

    ruffle-player {
      width: 100%;
      height: 700px;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <script>
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      document.getElementById("game").appendChild(player);

      player.ruffle().load("papasfreezeria_v2.swf");
    });
  </script>
</body>
</html>
